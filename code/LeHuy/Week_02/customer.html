<!doctype html><html lang="vi"><meta charset="utf-8"><title>FoodDelivery tuần 2 Khách hàng</title><style>body{font:17px Georgia,serif;max-width:1000px;margin:30px auto;padding:0 20px}
input{padding:8px;margin:5px 0;max-width:95%}button{padding:9px;margin:4px}label{display:block}
pre{border:1px solid #bbb;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:15px;flex-wrap:wrap}h1{font-size:25px}#log{max-height:350px;overflow:auto}</style>
 <h1>FoodDelivery tuần 2 – Khách hàng</h1><p>Trang thực hành nội bộ. Token phiên thử do backend quản lý, không phải khóa AWS.</p>
 <label>WebSocket endpoint <input id="endpoint" size="80" placeholder="wss://API_ID.execute-api.us-east-1.amazonaws.com/dev"></label>
 <label>Token phiên thử <input id="token" type="password" size="60" autocomplete="off"></label>
 <button onclick="connect()">Kết nối</button><button onclick="disconnect()">Ngắt</button>
 <button onclick="perform({action:'ping'})">Ping</button><span id="connection">CLOSED</span>
 <h2>Tạo đơn</h2><label>Món ăn <input id="food" value="Cơm gà"></label>
 <label>Số lượng <input id="quantity" type="number" min="1" max="20" value="1"></label>
 <label>Địa chỉ thử <input id="address" value="Khu ký túc xá A"></label>
 <button onclick="createOrder()">Tạo đơn mới</button><button onclick="retryCreate()">Gửi lại cùng yêu cầu</button><h2>Đơn đang theo dõi</h2><label>Mã đơn <input id="order" size="45"></label>
 <button onclick="readOrder()">Đọc đơn</button><button onclick="watch()">Theo dõi đơn</button>
 <pre id="snapshot">Chưa chọn đơn</pre><h2>Nhật ký thử</h2><pre id="log"></pre>
 <script src="shared.js"></script></html>
